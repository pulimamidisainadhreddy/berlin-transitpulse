services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: transitpulse
      POSTGRES_USER: transit
      POSTGRES_PASSWORD: transit_local_dev
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transit -d transitpulse"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
